name: DevSecOps - Build, Test, Scan, and Deploy

on:
  push:
    branches:
      - DevOps-CVM

env:
  DJANGO_SETTINGS_MODULE: api.settings
  EMAIL_HOST_USER: ${{ secrets.EMAIL_HOST_USER }}
  DATABASE_URL: ${{ secrets.DATABASE_URL }}
  EMAIL_HOST_PASSWORD: ${{ secrets.EMAIL_HOST_PASSWORD }}
  DEFAULT_FROM_EMAIL: ${{ secrets.DEFAULT_FROM_EMAIL }}
  DJANGO_ALLOWED_HOSTS: ${{ secrets.DJANGO_ALLOWED_HOSTS }}
  DJANGO_CORS_ALLOWED_ORIGINS: ${{ secrets.DJANGO_CORS_ALLOWED_ORIGINS }}
  DJANGO_CSRF_TRUSTED_ORIGINS: ${{ secrets.DJANGO_CSRF_TRUSTED_ORIGINS }}

jobs:
  security-checks:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3
        with:
          fetch-depth: 0  # Required for Gitleaks to have full history

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Install scanning tools
        run: pip install bandit flake8 safety

      - name: Run Bandit security scan
        run: |
          bandit -r . -ll --exclude */tests/*,*/migrations/* -o bandit_results.txt
        continue-on-error: false

      - name: Run Safety dependency check
        run: |
          safety check -o safety_results.txt
        continue-on-error: false

      - name: Run Flake8 linting
        run: |
          flake8 . --max-line-length=120 --exclude=*/migrations/*,env/* > flake8_results.txt
        continue-on-error: false

      - name: Setup Gitleaks
        run: |
          wget -q https://github.com/zricethezav/gitleaks/releases/download/v8.16.3/gitleaks_8.16.3_linux_x64.tar.gz
          tar -xzf gitleaks_8.16.3_linux_x64.tar.gz
          chmod +x gitleaks

      - name: Run Gitleaks for secrets detection
        run: |
          ./gitleaks detect --report-format json --report-path gitleaks_results.json
        continue-on-error: false

      - name: Upload scan results as artifacts
        uses: actions/upload-artifact@v4
        with:
          name: scan-results
          path: |
            bandit_results.txt
            safety_results.txt
            flake8_results.txt
            gitleaks_results.json
          if-no-files-found: warn

      - name: Check for critical security issues
        id: check-security
        run: |
          CRITICAL_ISSUES_FOUND=false
          # Check for critical issues in Bandit results
          if grep -q "HIGH" bandit_results.txt; then
            CRITICAL_ISSUES_FOUND=true
          fi
          # Check for critical issues in Safety results
          if grep -q "Critical" safety_results.txt; then
            CRITICAL_ISSUES_FOUND=true
          fi
          # Check for secrets in Gitleaks results
          if [ -s gitleaks_results.json ]; then
            CRITICAL_ISSUES_FOUND=true
          fi
          echo "critical_issues_found=${CRITICAL_ISSUES_FOUND}" >> $GITHUB_OUTPUT

      - name: Send Security Alert Email
        if: steps.check-security.outputs.critical_issues_found == 'true'
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: ${{ secrets.SMTP_SERVER }}
          server_port: ${{ secrets.SMTP_PORT }}
          username: ${{ secrets.EMAIL_HOST_USER }}
          password: ${{ secrets.EMAIL_HOST_PASSWORD }}
          subject: "[ALERT] Critical Security Issues Detected in AfripointGroup Pipeline"
          body: |
            Critical security issues were detected in the latest code push to the dev branch.
            
            Please review the GitHub Actions run for more details:
            https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
          from: ${{ secrets.DEFAULT_FROM_EMAIL }}
          to: ${{ secrets.SECURITY_ALERT_EMAILS }}
          content_type: text/plain

  test:
    runs-on: ubuntu-latest
    needs: security-checks
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Setup directory structure
        run: |
          mkdir -p static
          mkdir -p staticfiles
          mkdir -p media
          mkdir -p templates
          echo "Created directory structure"
          ls -la

      - name: Setup Database and Static Files
        run: |
          chmod -R 755 static staticfiles media templates
          python manage.py makemigrations accounts
          python manage.py makemigrations departments
          python manage.py makemigrations verifications
          python manage.py makemigrations vins_search
          python manage.py migrate
          touch static/.gitkeep
          python manage.py collectstatic --noinput
          echo "Static files collection completed"
          ls -la staticfiles/

      - name: Run tests
        run: python manage.py test

  build-and-push:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Login to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_TOKEN }}

      - name: Build and push web service
        uses: docker/build-push-action@v4
        with:
          context: .
          push: true
          tags: afripoint/cvms_backend_conversion-web:latest
          cache-from: type=registry,ref=afripoint/cvms_backend_conversion-web:buildcache
          cache-to: type=registry,ref=afripoint/cvms_backend_conversion-web:buildcache,mode=max
          build-args: |
            EMAIL_HOST_USER=${{ secrets.EMAIL_HOST_USER }}
            EMAIL_HOST_PASSWORD=${{ secrets.EMAIL_HOST_PASSWORD }}
            DEFAULT_FROM_EMAIL=${{ secrets.DEFAULT_FROM_EMAIL }}
            DJANGO_SETTINGS_MODULE=api.settings

      - name: Build and push Nginx service
        uses: docker/build-push-action@v4
        with:
          context: ./nginx
          push: true
          tags: afripoint/cvms_backend_conversion-nginx:latest
          cache-from: type=registry,ref=afripoint/cvms_backend_conversion-nginx:buildcache
          cache-to: type=registry,ref=afripoint/cvms_backend_conversion-nginx:buildcache,mode=max

  security-scan:
    runs-on: ubuntu-latest
    needs: build-and-push
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Pull Docker images
        run: |
          docker pull afripoint/cvms_backend_conversion-web:latest
          docker pull afripoint/cvms_backend_conversion-nginx:latest

      - name: Install Trivy
        run: |
          wget -qO - https://aquasecurity.github.io/trivy-repo/deb/public.key | gpg --dearmor | sudo tee /usr/share/keyrings/trivy.gpg > /dev/null
          echo "deb [signed-by=/usr/share/keyrings/trivy.gpg] https://aquasecurity.github.io/trivy-repo/deb $(lsb_release -sc) main" | sudo tee /etc/apt/sources.list.d/trivy.list
          sudo apt-get update
          sudo apt-get install -y trivy

      - name: Scan Web Docker image
        id: scan-web
        run: |
          trivy image afripoint/cvms_backend_conversion-web:latest --format json --output web-scan-results.json
          trivy image afripoint/cvms_backend_conversion-web:latest --severity HIGH,CRITICAL --exit-code 1 || echo "HIGH_VULN_WEB=true" >> $GITHUB_ENV
        continue-on-error: true

      - name: Scan Nginx Docker image
        id: scan-nginx
        run: |
          trivy image afripoint/cvms_backend_conversion-nginx:latest --format json --output nginx-scan-results.json
          trivy image afripoint/cvms_backend_conversion-nginx:latest --severity HIGH,CRITICAL --exit-code 1 || echo "HIGH_VULN_NGINX=true" >> $GITHUB_ENV
        continue-on-error: true

      - name: Upload Docker scan results
        uses: actions/upload-artifact@v4
        with:
          name: docker-scan-results
          path: |
            web-scan-results.json
            nginx-scan-results.json
          if-no-files-found: warn

      - name: Send Docker Security Alert Email
        if: env.HIGH_VULN_WEB == 'true' || env.HIGH_VULN_NGINX == 'true'
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: ${{ secrets.SMTP_SERVER }}
          server_port: ${{ secrets.SMTP_PORT }}
          username: ${{ secrets.EMAIL_HOST_USER }}
          password: ${{ secrets.EMAIL_HOST_PASSWORD }}
          subject: "[ALERT] Docker Image Vulnerabilities Detected in AfripointGroup Pipeline"
          body: |
            High or Critical vulnerabilities were detected in the Docker images.
            
            Please review the GitHub Actions run for more details:
            https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
          from: ${{ secrets.DEFAULT_FROM_EMAIL }}
          to: ${{ secrets.SECURITY_ALERT_EMAILS }}
          content_type: text/plain

  deploy:
    runs-on: ubuntu-latest
    needs: security-scan
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up SSH
        uses: webfactory/ssh-agent@v0.7.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: Add server to known hosts
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.KNOWN_HOSTS }}" >> ~/.ssh/known_hosts

      - name: Copy docker-compose.prod.yml
        run: scp docker-compose.prod.yml ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_IP }}:~/cvms/

      - name: Create .env file on server
        run: |
          ssh ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_IP }} << 'EOF'
            cat > ~/cvms/.env <<EOL
            DJANGO_SETTINGS_MODULE=${{ secrets.DJANGO_SETTINGS_MODULE }}
            DATABASE_URL=${{ secrets.DATABASE_URL }}
            DJANGO_SECRET_KEY=${{ secrets.DJANGO_SECRET_KEY }}
            DJANGO_ALLOWED_HOSTS=${{ secrets.DJANGO_ALLOWED_HOSTS }}
            DJANGO_CSRF_TRUSTED=${{ secrets.DJANGO_CSRF_TRUSTED }}
            DJANGO_CORS_ALLOWED=${{ secrets.DJANGO_CORS_ALLOWED }}
            EMAIL_HOST=${{ secrets.EMAIL_HOST }}
            EMAIL_PORT=${{ secrets.EMAIL_PORT }}
            EMAIL_HOST_USER=${{ secrets.EMAIL_HOST_USER }}
            EMAIL_HOST_PASSWORD=${{ secrets.EMAIL_HOST_PASSWORD }}
            DEFAULT_FROM_EMAIL=${{ secrets.DEFAULT_FROM_EMAIL }}
            EOL
            EOF
      
      - name: Set up directories on server
        run: |
          ssh ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_IP }} '
            mkdir -p ~/cvms/staticfiles
            mkdir -p ~/cvms/media
            chmod -R 755 ~/cvms/staticfiles
            chmod -R 755 ~/cvms/media
          '

      - name: Deploy services
        run: |
          ssh ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_IP }} '
            cd ~/cvms
            docker-compose -f docker-compose.prod.yml pull
            docker-compose -f docker-compose.prod.yml down --remove-orphans
            docker-compose -f docker-compose.prod.yml up -d
          '

      - name: Run database migrations
        run: |
          ssh ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_IP }} '
            cd ~/cvms
            docker-compose -f docker-compose.prod.yml exec -T web python manage.py migrate
          '

      - name: Send Deployment Notification
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: ${{ secrets.SMTP_SERVER }}
          server_port: ${{ secrets.SMTP_PORT }}
          username: ${{ secrets.EMAIL_HOST_USER }}
          password: ${{ secrets.EMAIL_HOST_PASSWORD }}
          subject: "Successful Deployment to Development Environment"
          body: |
            A new version of the application has been successfully deployed to the development environment.
            
            Commit: ${{ github.sha }}
            Branch: dev
            Deployed by: ${{ github.actor }}
            Deployment time: ${{ github.event.head_commit.timestamp }}
          from: ${{ secrets.DEFAULT_FROM_EMAIL }}
          to: ${{ secrets.DEPLOYMENT_NOTIFICATION_EMAILS }}
          content_type: text/plain