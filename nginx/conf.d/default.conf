# ===============================
# HTTP Server for cvms-api.afripointdev.com
# ===============================
server {
    listen 80;
    server_name cvms-api.afripointdev.com;

    location / {
        proxy_pass http://web:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /static/ {
        alias /app/staticfiles/;
        expires 30d;
        access_log off;
    }

    location /media/ {
        alias /app/media/;
        expires 30d;
        access_log off;
    }
}

# ===============================
# HTTPS Server for cvmsnigeria.com using afridev.com.ng cert
# ===============================
server {
    listen 443 ssl;
    server_name cvmsnigeria.com www.cvmsnigeria.com;

    # Reused SSL certificate from afridev.com.ng
    ssl_certificate      /etc/nginx/ssl/afridev_com_ng_combined.crt;
    ssl_certificate_key  /etc/nginx/ssl/afridev_com_ng.key;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;
    ssl_ciphers 'ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256';
    ssl_session_cache shared:SSL:10m;

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

# ===============================
# Optional: Redirect HTTP → HTTPS for cvmsnigeria.com
# ===============================
server {
    listen 80;
    server_name cvmsnigeria.com www.cvmsnigeria.com;
    return 301 https://$host$request_uri;
}

