# HTTPS Server (SSL)
server {
    listen 443 ssl;
    server_name afridev.com.ng www.afridev.com.ng 89.117.37.128;

    # SSL Paths (EXACTLY match your /etc/nginx/ssl/ structure)
    ssl_certificate      /etc/nginx/ssl/afridev_com_ng.crt;
    ssl_certificate_key  /etc/nginx/ssl/afridev_com_ng.key;
    ssl_trusted_certificate /etc/nginx/ssl/ca_bundle.crt;

    # Security (validated settings)
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;
    ssl_ciphers 'ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256';
    ssl_session_cache shared:SSL:10m;

    # Proxy to Django
    location / {
        proxy_pass http://web:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Static files (matches your ~/cvms/staticfiles/)
    location /static/ {
        alias /app/staticfiles/;
        expires 30d;
        access_log off;
    }

    # Media files (matches your ~/cvms/media/)
    location /media/ {
        alias /app/media/;
        expires 30d;
        access_log off;
    }
}

# HTTP → HTTPS Redirect
server {
    listen 80;
    server_name afridev.com.ng www.afridev.com.ng 89.117.37.128;
    return 301 https://$host$request_uri;
}