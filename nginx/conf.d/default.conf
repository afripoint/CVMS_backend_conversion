# Backend API (Django)
server {
    listen 80;
    server_name cvms-api.afripointdev.com;

    location / {
        proxy_pass http://web:8000;  # Backend service (Django)
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /static/ {
        alias /app/staticfiles/;
        expires 30d;
        access_log off;
    }

    location /media/ {
        alias /app/media/;
        expires 30d;
        access_log off;
    }
}

# Frontend Static (Next.js)
server {
    listen 80;
    server_name cvmsnigeria.com www.cvmsnigeria.com;

    location / {
        proxy_pass http://cvmsnigeria-frontend:80;  # Frontend service (static files)
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /static/ {
        alias /usr/share/nginx/html/static/;  # Serve static files directly
        expires 30d;
        access_log off;
    }

    location /media/ {
        alias /usr/share/nginx/html/media/;  # Serve media files directly
        expires 30d;
        access_log off;
    }
}
