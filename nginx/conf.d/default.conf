######################################
# Backend API (Django)
######################################
server {
    listen 80;
    server_name cvms-api.afripointdev.com;

    location / {
        proxy_pass http://web:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /static/ {
        alias /app/staticfiles/;
        autoindex off;
        expires 30d;
        access_log off;
    }

    location /media/ {
        alias /app/media/;
        autoindex off;
        expires 30d;
        access_log off;
    }
}

######################################
# Frontend Static (Vite + serve)
######################################
server {
    listen 80;
    server_name cvms.afripointdev.com;

    location / {
        proxy_pass http://uatcvmsnigeria-frontend:80;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Optional if static assets are also served separately
    location /assets/ {
        proxy_pass http://uatcvmsnigeria-frontend:80;
        proxy_set_header Host $host;
    }

    location /favicon.ico {
        proxy_pass http://uatcvmsnigeria-frontend:80;
    }
}


