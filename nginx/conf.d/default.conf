# Backend API (Django)
server {
    listen 80;
    server_name cvms-api.afripointdev.com;

    location / {
        proxy_pass http://web:8000;  
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /static/ {
        alias /app/staticfiles/;
        autoindex off;
        expires 30d;
        access_log off;
    }

    location /media/ {
        alias /app/media/;
        autoindex off;
        expires 30d;
        access_log off;
    }
}

# Frontend Static (Next.js) – UAT
server {
    listen 80;
    server_name cvms.afripointdev.com;

    location / {
        proxy_pass http://uatcvmsnigeria-frontend:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /static/ {
        alias /usr/share/nginx/html/static/;
        autoindex off;
        expires 30d;
        access_log off;
    }

    location /media/ {
        alias /usr/share/nginx/html/media/;
        autoindex off;
        expires 30d;
        access_log off;
    }
}


