# ===============================
# HTTP: API Backend (Django)
# ===============================
server {
    listen 80;
    server_name cvms-api.afripointdev.com;

    location / {
        proxy_pass http://web:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /static/ {
        alias /app/staticfiles/;
        expires 30d;
        access_log off;
    }

    location /media/ {
        alias /app/media/;
        expires 30d;
        access_log off;
    }
}

# ===============================
# HTTP: Frontend (Next.js static)
# ===============================
server {
    listen 80;
    server_name cvmsnigeria.com www.cvmsnigeria.com;

    location / {
        proxy_pass http://cvmsnigeria-frontend:80;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}


