services:
  db:
    image: postgres:14-alpine
    container_name: postgres_db
    restart: always
    environment:
      POSTGRES_DB: django_db
      POSTGRES_USER: django_user
      POSTGRES_PASSWORD: securepassword
    volumes:
      - cvms_backend_conversion_db_data:/var/lib/postgresql/data
    networks:
      - my-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U django_user -d django_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  web:
    build:
      context: .
      dockerfile: Dockerfile
    command: ["/entrypoint.sh"]
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      DJANGO_SUPERUSER_EMAIL: ${DJANGO_SUPERUSER_EMAIL}
      DJANGO_SUPERUSER_PASSWORD: ${DJANGO_SUPERUSER_PASSWORD}
      DJANGO_SUPERUSER_USERNAME: admin
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - cvms_backend_conversion_static_data:/app/staticfiles
      - cvms_backend_conversion_media_data:/app/media
    networks:
      - my-network
    #healthcheck:
    # test: ["CMD-SHELL", "curl -f http://127.0.0.1:8000/ || exit 1"]
    #  interval: 10s
    #  retries: 5
    #  start_period: 15s  # Increased to give Django more time to start
    # timeout: 10s       # Increased timeout to prevent false failures

  nginx:
    image: nginx:latest
    container_name: nginx
    restart: always
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/conf.d/:/etc/nginx/conf.d/:ro
      - cvms_backend_conversion_static_data:/app/staticfiles:rw
      - cvms_backend_conversion_media_data:/app/media:rw
    depends_on:
      - web  # Removed "condition: service_healthy" to prevent blocking
    networks:
      - my-network

volumes:
  cvms_backend_conversion_db_data:
    external: true
  cvms_backend_conversion_static_data:
    external: true
  cvms_backend_conversion_media_data:
    external: true

networks:
  my-network: